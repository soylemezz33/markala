# Markala — STAGING vhost'ları (test.markala.com.tr + test-api.markala.com.tr)
# Prod nginx container'ı serve eder; upstream'ler staging compose stack'i
# (docker-compose.staging.yml, aynı docker network).
#
# ÖNEMLİ — resolver + değişkenli proxy_pass deseni:
# Upstream hostname'i config yükleme anında DEĞİL istek anında çözülür.
# Böylece staging container'ları kapalıyken nginx reload/restart BAŞARISIZ OLMAZ
# (prod'u riske atmaz); staging kapalıysa bu vhost'lar 502 döner, prod etkilenmez.
#
# SSL: *.markala.com.tr origin sertifikası tek seviyeli subdomain'leri kapsar —
# test.markala.com.tr ve test-api.markala.com.tr bilinçli olarak tek seviye seçildi
# (api.test.markala.com.tr wildcard kapsamı DIŞINDA kalırdı).

# === Staging Web — test.markala.com.tr ===
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.markala.com.tr;

    ssl_certificate /etc/nginx/ssl/markala.com.tr.pem;
    ssl_certificate_key /etc/nginx/ssl/markala.com.tr.key;

    # Docker gömülü DNS — istek anında çözüm için şart (yukarıdaki not).
    resolver 127.0.0.11 valid=10s;
    set $staging_web http://staging-web:3000;

    # Arama motorlarına asla görünmesin
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Rate limit — prod'la aynı zone'lar (nginx.conf'ta tanımlı)
    limit_req zone=general burst=60 nodelay;
    limit_conn connlimit 50;

    # İsteğe bağlı basic auth (dış göze tamamen kapatmak için):
    # 1) VPS: docker exec markala-nginx sh -c "apk add --no-cache apache2-utils && htpasswd -bc /etc/nginx/conf.d/.htpasswd markala '<ŞİFRE>'"
    #    (kalıcılık için dosyayı ./nginx/conf.d/.htpasswd olarak host'a koy — volume zaten mount'lu)
    # 2) Aşağıdaki iki satırın yorumunu aç + nginx reload.
    # auth_basic "Markala Staging";
    # auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    location / {
        proxy_pass $staging_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
        # Staging'de cache YOK — her istek taze (test ortamı amacı).
        proxy_cache off;
    }
}

# === Staging API — test-api.markala.com.tr ===
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-api.markala.com.tr;

    ssl_certificate /etc/nginx/ssl/markala.com.tr.pem;
    ssl_certificate_key /etc/nginx/ssl/markala.com.tr.key;

    resolver 127.0.0.11 valid=10s;
    set $staging_api http://staging-api:4000;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    limit_req zone=api burst=120 nodelay;
    limit_conn connlimit 50;

    # CORS tamamen NestJS'te (WEB_ORIGIN=https://test.markala.com.tr) — prod'daki gibi
    # nginx CORS header'ı EKLEMEZ (çift header sorunu, bkz. markala.conf notu).

    location / {
        proxy_pass $staging_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
