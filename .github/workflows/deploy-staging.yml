# Markala — STAGING deploy (test.markala.com.tr)
# Tetik: `staging` branch'ine push ya da elle (workflow_dispatch).
# Akış: web+api imajlarını staging build-arg'larıyla build et (tag: staging) →
# compose+nginx staging dosyalarını VPS'e kopyala → staging stack'i güncelle →
# nginx reload → sağlık kontrolü. PROD SERVİSLERİNE DOKUNMAZ.
#
# Önkoşullar (bir kere): docs/STAGING.md — Cloudflare DNS (test, test-api),
# /opt/markala/.env.staging, prod network adı doğrulaması.
name: Deploy to Staging

# 2026-08-20: staging KAPATILMIŞTI (DNS taşınmamıştı, "deploy yansımıyor" yanılgısı).
# 2026-08-22: header menü işi test-önce-canlı akışıyla isteneceği için YENİDEN AÇILDI.
# DNS önkoşulu: Cloudflare'de test + test-api A kayıtları markala.com.tr ile AYNI
# IP'ye, Proxied olarak eklenmeli (bkz. docs/STAGING.md). Staging DB boşsa
# staging-db-copy-prod ile prod kopyası yüklenmeli.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Staging Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [web, api]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # Staging'in kendi API origin'i build-time gömülür. Analytics/doğrulama
          # ID'leri BİLEREK boş — staging trafiği GA4/Clarity/GTM'e karışmasın.
          # API_INTERNAL_URL: build-time prerender fetch'leri PROD API'den okur (salt GET) —
          # staging API imaj build sırasında henüz yok (tavuk-yumurta). Runtime'da compose
          # bunu http://staging-api:4000 ile ezer.
          build-args: |
            NEXT_PUBLIC_API_URL=https://test-api.markala.com.tr
            API_INTERNAL_URL=https://api.markala.com.tr
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}:staging
          # Prod build'leriyle aynı cache scope'ları — staging build'leri hızlanır,
          # prod cache'i bozulmaz (cache-to yok, sadece okur).
          cache-from: type=gha,scope=${{ matrix.app }}
          platforms: linux/amd64

  deploy:
    name: Deploy Staging (self-hosted APP-VM)
    needs: build-and-push
    # 2026-08-20: staging deploy'u "Compose + nginx conf'u VPS'e kopyala" adımında
    # düşüyordu. Sebep prod'da 2026-08-17'de teşhis edilenin AYNISI: production/staging
    # iç ağdaki APP-VM'de (10.20.33.5), GitHub'ın hosted runner'ı oraya SSH ile
    # ulaşamıyor. Prod bu yüzden self-hosted runner'a taşındı; staging geride kalmıştı.
    # Staging stack'i ZATEN aynı makinede (/opt/markala, aynı markala-nginx) durduğu
    # için çözüm birebir aynı: runner APP-VM'in İÇİNDE, deploy yerel docker ile.
    runs-on: [self-hosted, app-vm]
    timeout-minutes: 15
    environment:
      name: staging
      url: https://test.markala.com.tr

    steps:
      - name: Checkout (compose + nginx conf için)
        uses: actions/checkout@v6

      # Staging dosyaları henüz main'de olmayabilir (test-önce-merge akışı) —
      # /opt/markala'daki git checkout'una DOKUNMADAN üzerine kopyalanır.
      # (Eskiden scp ile yapılıyordu; runner artık aynı makinede olduğu için düz cp.)
      - name: Compose + nginx conf'u yerine koy
        run: |
          set -e
          sudo install -m 644 docker-compose.staging.yml /opt/markala/docker-compose.staging.yml
          sudo install -D -m 644 nginx/conf.d/staging.conf /opt/markala/nginx/conf.d/staging.conf
          echo "✓ staging compose + nginx conf güncellendi"

      # Mantık betikte (scripts/deploy-staging-appvm.sh) — prod deploy ile aynı desen.
      # sudo: .env.staging root-only ve docker soketi root'a ait.
      - name: Staging stack'i güncelle (yerel docker)
        run: |
          chmod +x scripts/deploy-staging-appvm.sh
          # Değişkenler AÇIKÇA geçiriliyor: `sudo -E` sudoers'da SETENV izni yoksa
          # "not allowed to preserve the environment" ile reddedilir.
          sudo GITHUB_REPOSITORY='${{ github.repository }}' \
               GITHUB_SHA='${{ github.sha }}' \
               bash scripts/deploy-staging-appvm.sh

      - name: Verify staging (external)
        run: |
          ok=0
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -m 25 -w '%{http_code}' -A "Mozilla/5.0 (GH-Actions verify)" "https://test.markala.com.tr") || code=000
            echo "https://test.markala.com.tr -> HTTP $code (deneme $i)"
            # 401 = basic auth açık (beklenen olabilir); <500 = origin ayakta.
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then ok=1; break; fi
            sleep 8
          done
          if [ "$ok" != "1" ]; then echo "❌ test.markala.com.tr origin hatası (DNS eklendi mi? docs/STAGING.md)"; exit 1; fi
          echo "✅ Staging dış doğrulama geçti"
