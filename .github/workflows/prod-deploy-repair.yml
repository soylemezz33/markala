# PROD DEPLOY ONARIM + TEŞHİS — 2026-08-17 "yeşil raporlanan ama uygulanmayan deploy" olayı.
#
# v3 — v2'de kanıtlandı: yeni kod İMAJDA VAR, markala-web o imajdan çalışıyor ve sağlıklı;
# yine de canlı HTML eski footer'ı taşıyor (Cloudflare cache DEĞİL: cf-cache-status DYNAMIC).
# Kalan tek açıklama: nginx `web` adını BAYAT bir konteynere çözüyor (Docker DNS'te aynı
# alias'ı taşıyan artık konteyner). Bu yüzden v3:
#   - konteynerin KENDİSİ ne servis ediyor (node fetch ile — wget bu imajda yok, v2'de HTML=0)
#   - nginx `web`'i hangi IP/konteynere çözüyor
#   - ağdaki tüm konteynerler + alias'ları
# ve ardından bayat konteynerleri temizleyip nginx'i yeniden yükler.
#
# GÜVENLİK: postgres'e DOKUNULMAZ. nginx yalnız reload/restart edilir (config değişmez).
# Tetik: elle (workflow_dispatch) ya da bu dosyanın kendisine push (main).
name: Prod Deploy Onarım (teşhis + force-recreate)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/prod-deploy-repair.yml"]

jobs:
  repair:
    name: Bayat konteyner teşhisi + nginx upstream onarımı
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH ile teşhis ve onarım
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 18m
          script: |
            cd /opt/markala

            echo "=============== 1) TÜM KONTEYNERLER ==============="
            docker ps -a --format '{{.Names}} | {{.Status}} | {{.Image}}' || true
            ALL=$(docker ps -a --format '{{.Names}}' | tr '\n' ',' )
            echo "::notice title=A-konteynerler::$ALL"

            echo "=============== 2) KONTEYNERİN KENDİSİ NE SERVİS EDİYOR (node fetch) ==============="
            SELF=$(docker exec markala-web node -e "fetch('http://127.0.0.1:3000/').then(r=>r.text()).then(t=>console.log('LEN='+t.length+' ETBIS='+(t.includes('etbis.ticaret.gov.tr')?1:0)+' LOGO='+(t.includes('markala-logo.svg')?1:0))).catch(e=>console.log('ERR '+e.message))" 2>&1 | tail -1)
            echo "markala-web kendisi: $SELF"
            echo "::notice title=B-konteyner-kendisi::$SELF"

            echo "=============== 3) NGINX 'web' ADINI NEYE ÇÖZÜYOR ==============="
            WEBIP=$(docker exec markala-nginx sh -c "getent hosts web | awk '{print \$1}' | head -1" 2>/dev/null || echo "")
            REALIP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' markala-web 2>/dev/null | awk '{print $1}')
            echo "nginx 'web' -> $WEBIP   |   markala-web gercek IP -> $REALIP"
            if [ "$WEBIP" = "$REALIP" ]; then
              echo "::notice title=C-dns::DOGRU - nginx web=$WEBIP markala-web=$REALIP"
            else
              echo "::error title=C-dns::BAYAT UPSTREAM - nginx web=$WEBIP ama markala-web=$REALIP"
            fi

            echo "=============== 4) AĞDAKİ TÜM IP -> KONTEYNER EŞLEMESİ ==============="
            MAP=""
            for c in $(docker ps -q); do
              nm=$(docker inspect -f '{{.Name}}' "$c" | sed 's|^/||')
              ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$c" | awk '{print $1}')
              [ -n "$ip" ] && MAP="$MAP $nm=$ip"
            done
            echo "$MAP"
            echo "::notice title=D-ip-map::$MAP"

            echo "=============== 5) NGINX ÜZERİNDEN ==============="
            VIA=$(docker exec markala-nginx sh -c "wget -q -O- --timeout=20 http://web:3000/ 2>/dev/null | wc -c" 2>/dev/null || echo 0)
            VIAE=$(docker exec markala-nginx sh -c "wget -q -O- --timeout=20 http://web:3000/ 2>/dev/null | grep -c etbis.ticaret.gov.tr" 2>/dev/null || echo 0)
            VIAL=$(docker exec markala-nginx sh -c "wget -q -O- --timeout=20 http://web:3000/ 2>/dev/null | grep -c markala-logo.svg" 2>/dev/null || echo 0)
            echo "nginx->web: LEN=$VIA ETBIS=$VIAE LOGO=$VIAL"
            echo "::notice title=E-nginx-uzerinden::LEN=$VIA ETBIS=$VIAE LOGO=$VIAL"

            echo "=============== 6) ONARIM: bayat konteynerleri sil + nginx restart ==============="
            # compose projesi dışındaki/artık konteynerleri temizle (markala-web/admin/api/nginx/postgres HARİÇ)
            for c in $(docker ps -aq); do
              nm=$(docker inspect -f '{{.Name}}' "$c" | sed 's|^/||')
              case "$nm" in
                markala-web|markala-admin|markala-api|markala-nginx|markala-postgres|markala-backup|markala-node-exporter|markala-nginx-exporter|markala-postgres-exporter|markala-prometheus|markala-staging-web|markala-staging-api|markala-staging-postgres) ;;
                *markala*) echo "  bayat siliniyor: $nm"; docker rm -f "$c" >/dev/null 2>&1 || true ;;
              esac
            done
            # nginx'i RESTART et (reload DNS önbelleğini her zaman temizlemez)
            docker restart markala-nginx >/dev/null 2>&1 || echo "nginx restart hatasi"
            sleep 12

            echo "=============== 7) ONARIM SONRASI DOĞRULAMA ==============="
            AFTER_IP=$(docker exec markala-nginx sh -c "getent hosts web | awk '{print \$1}' | head -1" 2>/dev/null || echo "")
            AFTER_E=$(docker exec markala-nginx sh -c "wget -q -O- --timeout=20 http://web:3000/ 2>/dev/null | grep -c etbis.ticaret.gov.tr" 2>/dev/null || echo 0)
            AFTER_L=$(docker exec markala-nginx sh -c "wget -q -O- --timeout=20 http://web:3000/ 2>/dev/null | grep -c markala-logo.svg" 2>/dev/null || echo 0)
            echo "sonrasi: web->$AFTER_IP  ETBIS=$AFTER_E LOGO=$AFTER_L"
            echo "::notice title=F-sonrasi::web=$AFTER_IP ETBIS=$AFTER_E LOGO=$AFTER_L"
            docker ps --format '{{.Names}} {{.Status}}' | grep markala || true
            echo "TAMAM"
