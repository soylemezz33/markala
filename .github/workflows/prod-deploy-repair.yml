# PROD DEPLOY TEŞHİS — 2026-08-17 "deploy yeşil ama canlı eski" olayı.
#
# v5 — KANITLANANLAR (v2-v4):
#   * Yeni kod imajda VAR; markala-web o imajdan çalışıyor ve KENDİSİ yeni footer'ı
#     servis ediyor (243 KB, etbis=1)
#   * nginx'in GERÇEK server bloğu (Host: markala.com.tr, TLS) da yeni içeriği dönüyor
#     (245 KB, etbis=1) — yani ORIGIN DOĞRU
#   * nginx `location /` HTML'i cache'lemiyor (proxy_cache yalnız 5 statik location'da)
#   * Cloudflare üzerinden gelen yanıt ise 247 KB, etbis=0 ve TÜM POP'larda (AMS/DUS) aynı;
#     bu sürüm 2026-08-08 ile bugün 09:36 arası bir derleme
#
# v5'in tek sorusu: CF'ten gelen istek ORIGIN'e ULAŞIYOR MU?
#   - Erişim kaydında görünüyorsa  -> nginx yeni içerik veriyor, CF yanıtı değiştiriyor
#   - Görünmüyorsa                 -> CF isteği origin'e hiç göndermiyor (edge cache/Always Online)
# Bu, düzeltmenin VPS'te mi Cloudflare'da mı olduğunu kesinleştirir.
#
# SALT OKUR: hiçbir şey değiştirilmez (cache purge dahil yok).
# Tetik: elle (workflow_dispatch) ya da bu dosyanın kendisine push (main).
name: Prod Deploy Onarım (teşhis + force-recreate)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/prod-deploy-repair.yml"]

jobs:
  repair:
    name: CF isteği origin'e ulaşıyor mu (erişim kaydı testi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runner'dan CF üzerinden benzersiz istek
        id: probe
        run: |
          TOKEN="probe$(date +%s)"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          BODY=$(curl -s -m 30 -A "Mozilla/5.0 (deploy-probe)" "https://markala.com.tr/?p=$TOKEN")
          LEN=$(printf %s "$BODY" | wc -c)
          ETB=$(printf %s "$BODY" | grep -c 'etbis.ticaret.gov.tr' || true)
          LOGO=$(printf %s "$BODY" | grep -c 'markala-logo.svg' || true)
          CFS=$(curl -s -m 25 -D - -o /dev/null -A "Mozilla/5.0 (deploy-probe)" "https://markala.com.tr/?p=$TOKEN-h" | grep -i '^cf-cache-status' | tr -d '\r')
          echo "token=$TOKEN LEN=$LEN ETBIS=$ETB LOGO=$LOGO $CFS"
          echo "::notice title=A-CF-yaniti::token=$TOKEN LEN=$LEN ETBIS=$ETB LOGO=$LOGO $CFS"

      - name: Origin erişim kaydında bu istek var mı
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 8m
          envs: TOKEN
          script: |
            TOKEN="${{ steps.probe.outputs.token }}"
            echo "aranan token: $TOKEN"

            echo "=============== 1) ERİŞİM KAYDI ÇALIŞIYOR MU ==============="
            TOTAL=$(docker exec markala-nginx sh -c "wc -l < /var/log/nginx/access.log" 2>/dev/null || echo 0)
            echo "access.log satir sayisi: $TOTAL"
            docker exec markala-nginx sh -c "tail -2 /var/log/nginx/access.log" 2>/dev/null || echo "(log okunamadi)"

            echo "=============== 2) TOKEN KAYITTA VAR MI ==============="
            HIT=$(docker exec markala-nginx sh -c "grep -c '$TOKEN' /var/log/nginx/access.log" 2>/dev/null || echo 0)
            LINE=$(docker exec markala-nginx sh -c "grep '$TOKEN' /var/log/nginx/access.log | head -1" 2>/dev/null || echo "")
            echo "token kayit sayisi: $HIT"
            echo "kayit satiri: $LINE"
            echo "::notice title=B-log-sayisi::token bulundu=$HIT (access.log toplam=$TOTAL)"
            echo "::notice title=C-log-satiri::$(echo "$LINE" | cut -c1-300)"

            if [ "$HIT" -gt 0 ] 2>/dev/null; then
              echo "::notice title=D-KARAR::ISTEK ORIGINE ULASTI -> sorun CF yanit katmaninda degil, nginx/upstream cevabinda"
            else
              echo "::error title=D-KARAR::ISTEK ORIGINE HIC ULASMADI -> Cloudflare edge cache/Always Online eski kopyayi servis ediyor. Cozum: CF cache purge."
            fi

            echo "=============== 3) AYNI ANDA ORIGIN NE DÖNÜYOR ==============="
            OE=$(docker exec markala-nginx sh -c "wget -q -O- --no-check-certificate --header='Host: markala.com.tr' https://127.0.0.1/ 2>/dev/null | grep -c etbis.ticaret.gov.tr" 2>/dev/null || echo 0)
            OL=$(docker exec markala-nginx sh -c "wget -q -O- --no-check-certificate --header='Host: markala.com.tr' https://127.0.0.1/ 2>/dev/null | wc -c" 2>/dev/null || echo 0)
            echo "origin: LEN=$OL ETBIS=$OE"
            echo "::notice title=E-origin-ayni-an::LEN=$OL ETBIS=$OE"
