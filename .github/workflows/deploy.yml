name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # Manuel tetikleme

concurrency:
  group: deploy-production
  cancel-in-progress: false # Deploy'lar üst üste binmemeli

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [web, admin, api]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # NEXT_PUBLIC_* BUILD-TIME gömülür — web/admin imajlarına buradan geçmeli.
          # (api bu arg'ları kullanmaz, görmezden gelir — zararsız.)
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.markala.com.tr
            NEXT_PUBLIC_GA4_ID=${{ vars.NEXT_PUBLIC_GA4_ID }}
            NEXT_PUBLIC_CLARITY_ID=${{ vars.NEXT_PUBLIC_CLARITY_ID }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_BING_VERIFICATION=${{ vars.NEXT_PUBLIC_BING_VERIFICATION }}
            NEXT_PUBLIC_YANDEX_VERIFICATION=${{ vars.NEXT_PUBLIC_YANDEX_VERIFICATION }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_ADS_PURCHASE_LABEL=${{ vars.NEXT_PUBLIC_ADS_PURCHASE_LABEL }}
            NEXT_PUBLIC_ADS_SIGNUP_LABEL=${{ vars.NEXT_PUBLIC_ADS_SIGNUP_LABEL }}
            NEXT_PUBLIC_ADS_LEAD_LABEL=${{ vars.NEXT_PUBLIC_ADS_LEAD_LABEL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          platforms: linux/amd64

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://markala.com.tr

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 13m
          script: |
            set -e
            cd /opt/markala
            # AKTİF DB incident'ı (2026-06-15) band-aid'i KIRILGAN: tam 'docker compose up'
            # + --remove-orphans postgres volume/network'ünü tekrar bozabilir. Bu yüzden deploy
            # postgres'e DOKUNMAZ — yalnız app servislerini (web/admin/api) günceller.
            echo "→ Pre-deploy DB yedeği (best-effort)..."
            mkdir -p backups
            docker exec markala-postgres sh -c 'pg_dump -U "${POSTGRES_USER:-markala}" "${POSTGRES_DB:-markala}"' > "backups/db-predeploy-$(date +%Y%m%d-%H%M%S).sql" 2>/dev/null || echo "  (yedek atlandı — manuel yedek al)"
            # 2026-08-17: deploy YEŞİL raporlanırken konteynerler güncellenmiyordu — canlıda
            # 37 saatlik uptime ile ESKİ kod çalışıyordu. Sağlık kontrolü eski (zaten sağlıklı)
            # konteynerleri doğruladığı için hata görünmüyordu. Üç savunma eklendi:
            #   1) pull ÖNCESİ/SONRASI imaj digest'i loglanır (imaj gerçekten yenilendi mi?)
            #   2) up -d artık --force-recreate ile çalışır (aynı digest'te bile konteyner yenilenir)
            #   3) deploy sonunda konteynerin GERÇEKTEN yeniden başladığı doğrulanır (aşağıda)
            echo "→ Pull öncesi imaj digest'leri:"
            for s in web admin api; do
              echo "   $s: $(docker inspect -f '{{index .RepoDigests 0}}' "markala-$s" 2>/dev/null || echo '(yok)')"
            done
            echo "→ App imajlarını çek (web/admin/api)..."
            docker compose -f docker-compose.production.yml --env-file .env.production pull web admin api
            echo "→ Önceki recreate kalıntılarını temizle (<hash>_markala-*)..."
            docker rm -f $(docker ps -aq --filter name=_markala- 2>/dev/null) 2>/dev/null || true
            echo "→ Sadece app servislerini güncelle (postgres/nginx KORUNUR)..."
            docker compose -f docker-compose.production.yml --env-file .env.production up -d --no-build --no-deps --force-recreate web admin api
            echo "→ Nginx reload (recreate sonrası bayat upstream IP fix)..."
            sleep 5
            docker exec markala-nginx nginx -s reload || { echo "⚠ nginx reload başarısız — bayat upstream riski (dış doğrulama yakalar)"; docker exec markala-nginx nginx -t 2>&1 || true; }
            # Sağlık kontrolü: host'ta 3000 portu publish DEĞİL ve host'ta curl YOK —
            # bu yüzden compose'un kendi healthcheck'lerine bakılır (tek doğru vantaj noktası).
            echo "→ Sağlık kontrolü (compose healthcheck, maks ~2 dk)..."
            ok=0
            for i in $(seq 1 12); do
              n=$(docker inspect -f '{{.State.Health.Status}}' markala-web markala-admin markala-api 2>/dev/null | grep -c '^healthy$' || true)
              echo "  deneme $i/12: healthy=$n/3"
              if [ "$n" = "3" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "❌ Health check failed! Container durumları:"
              docker ps --format '{{.Names}} {{.Status}}' | grep markala || true
              exit 1
            fi
            # Konteynerler GERÇEKTEN yeniden başladı mı? Sağlık kontrolü bunu yakalayamaz:
            # eski konteyner de "healthy" olduğu için deploy sessizce yeşil raporlanabiliyordu.
            # 10 dakikadan eski bir başlangıç zamanı = recreate uygulanmadı → deploy'u DÜŞÜR.
            echo "→ Konteynerlerin yeniden başladığı doğrulanıyor..."
            now=$(date +%s)
            stale=0
            for s in web admin api; do
              started=$(docker inspect -f '{{.State.StartedAt}}' "markala-$s" 2>/dev/null || echo "")
              if [ -z "$started" ]; then echo "  ❌ markala-$s bulunamadı"; stale=1; continue; fi
              st=$(date -d "$started" +%s 2>/dev/null || echo 0)
              age=$(( (now - st) / 60 ))
              echo "  markala-$s: ${age} dk önce başladı"
              [ "$age" -gt 10 ] && { echo "    ❌ yeniden başlatılmamış (eski kod çalışıyor olabilir)"; stale=1; }
            done
            if [ "$stale" = "1" ]; then
              echo "❌ Deploy uygulanmadı: bir veya daha fazla konteyner yenilenmedi."
              echo "   .env.production içindeki TAG değişkenini ve GHCR pull çıktısını kontrol et."
              exit 1
            fi
            echo "→ Eski imaj + build cache temizliği (volume/DB DOKUNULMAZ)..."
            docker image prune -f || true
            docker builder prune -f >/dev/null 2>&1 || true
            df -h / | tail -1
            echo "✅ Deploy complete: ${{ github.sha }}"

      # Dış doğrulama runner'dan yapılır (VPS host'unda curl yok). CF challenge'ı
      # 403 dönebilir — origin çökmesini (502/520/521) yakalamak için eşik <500.
      - name: Verify production (external)
        run: |
          for u in "https://markala.com.tr" "https://api.markala.com.tr/api/health"; do
            ok=0
            for i in $(seq 1 6); do
              code=$(curl -s -o /dev/null -m 25 -w '%{http_code}' -A "Mozilla/5.0 (GH-Actions verify)" "$u") || code=000
              echo "$u -> HTTP $code (deneme $i)"
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then ok=1; break; fi
              sleep 8
            done
            if [ "$ok" != "1" ]; then echo "❌ $u origin hatası veriyor"; exit 1; fi
          done
          echo "✅ Dış doğrulama geçti"

      # 2026-08-17 olayı: deploy AYLARDIR yeşil raporlanıyordu ama canlı site hiç
      # güncellenmiyordu — çünkü 15 Ağustos 20:16'da prod DNS yeni sunucuya (ESXi/Turhost)
      # taşındı, deploy ise ESKİ VPS'e gitmeye devam etti. Konteyner sağlığı ve StartedAt
      # kontrolü DOĞRU sunucuda çalıştığı için hiçbir uyarı üretmedi.
      # Bu adım, deploy ettiğimiz makinenin GERÇEKTEN canlı trafiği alan makine olduğunu
      # kanıtlar: konteyner az önce yeniden başlatıldığına göre canlı /api/health'in
      # bildirdiği uptime KÜÇÜK olmalı. Büyükse yanlış sunucuya deploy ediyoruz.
      - name: Canlı gerçekten güncellendi mi (uptime kanıtı)
        run: |
          UP=$(curl -s -m 25 -A "Mozilla/5.0 (GH-Actions verify)" "https://markala.com.tr/api/health" \
               | grep -o '"uptime":[0-9.]*' | cut -d: -f2 | cut -d. -f1)
          echo "canlı /api/health uptime = ${UP:-bilinmiyor} sn"
          if [ -z "$UP" ]; then
            echo "⚠ uptime okunamadı — doğrulama atlandı (health yanıtı beklenenden farklı)"
            exit 0
          fi
          if [ "$UP" -gt 900 ]; then
            echo "❌ DEPLOY CANLIYA YANSIMADI: canlı konteyner ${UP} sn ayakta (yeni başlatılmamış)."
            echo "   Deploy edilen sunucu, canlı trafiği alan sunucu DEĞİL."
            echo "   Kontrol: Cloudflare'da markala.com.tr A kaydının IP'si ile SSH_HOST secret'ı aynı mı?"
            exit 1
          fi
          echo "✅ Canlı konteyner yeni başlatılmış (${UP} sn) — deploy gerçekten yansıdı"

      - name: Notify on success
        if: success()
        run: echo "✅ Markala deployed successfully — https://markala.com.tr"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deploy FAILED — check VPS logs immediately"
