name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # Manuel tetikleme

concurrency:
  group: deploy-production
  cancel-in-progress: false # Deploy'lar üst üste binmemeli

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # KAPI (2026-09-03): tip kontrolü + testler + build + format. ci.yml'in AYNISI —
  # workflow_call ile yeniden kullanılıyor, kopyalanmıyor. Canlıya alma bu işin
  # sonucuna bağlı; imaj derlemesiyle PARALEL koşar, o yüzden deploy süresi uzamaz.
  dogrulama:
    name: Doğrulama (CI)
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [web, admin, api]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            # Tam sha: deploy TAM OLARAK bu commit'in imajını çeker. "latest" hareketli
            # bir hedef; hangi commit'in canlıda olduğunu kanıtlamıyordu.
            type=sha,prefix={{branch}}-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # NEXT_PUBLIC_* BUILD-TIME gömülür — web/admin imajlarına buradan geçmeli.
          # (api bu arg'ları kullanmaz, görmezden gelir — zararsız.)
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.markala.com.tr
            NEXT_PUBLIC_GA4_ID=${{ vars.NEXT_PUBLIC_GA4_ID }}
            NEXT_PUBLIC_CLARITY_ID=${{ vars.NEXT_PUBLIC_CLARITY_ID }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_BING_VERIFICATION=${{ vars.NEXT_PUBLIC_BING_VERIFICATION }}
            NEXT_PUBLIC_YANDEX_VERIFICATION=${{ vars.NEXT_PUBLIC_YANDEX_VERIFICATION }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_ADS_PURCHASE_LABEL=${{ vars.NEXT_PUBLIC_ADS_PURCHASE_LABEL }}
            NEXT_PUBLIC_ADS_SIGNUP_LABEL=${{ vars.NEXT_PUBLIC_ADS_SIGNUP_LABEL }}
            NEXT_PUBLIC_ADS_LEAD_LABEL=${{ vars.NEXT_PUBLIC_ADS_LEAD_LABEL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          platforms: linux/amd64

  deploy:
    name: Deploy (self-hosted APP-VM)
    # İKİSİ de yeşil olmadan canlıya çıkılmaz. build-and-push tek başına yeterli
    # değildi: 2026-09-02'de main'de bozuk kod varken başka bir oturumun push'u
    # üretimi çökertti — imaj derlenebiliyordu ama kod çalışmıyordu.
    needs: [dogrulama, build-and-push]
    # 2026-08-17: SSH-over-NAT yaklaşımı kırıldı — production iç ağda (APP-VM 10.20.33.5),
    # GitHub dışarıdan doğrudan erişemiyor; DNS göçünde deploy yanlış sunucuya gitti.
    # Kalıcı çözüm: APP-VM'in İÇİNDE self-hosted runner. Runner GitHub'a DIŞARI bağlanır
    # (giden trafik), hiçbir port açılmaz, deploy yerel docker ile yapılır — NAT/SSH yok.
    runs-on: [self-hosted, app-vm]
    timeout-minutes: 15
    environment:
      name: production
      url: https://markala.com.tr

    steps:
      # Runner APP-VM'de; deploy betiğini repodan almak için checkout gerekir.
      - name: Checkout
        uses: actions/checkout@v6

      # Deploy'lar concurrency ile SIRAYA girer. Birden çok oturum arka arkaya push
      # ederse kuyrukta bekleyen ESKİ commit'ler anlamsızdır — hatta sırayla uygulanınca
      # canlıyı geriye alırlar. Bu adım, bu commit artık main'in ucu değilse deploy'u
      # atlar (hata değil): daha yeni deploy zaten kuyrukta.
      - name: Bu commit hâlâ main'in ucu mu?
        id: guncel
        run: |
          UC=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
          echo "main ucu : $UC"
          echo "bu commit: ${{ github.sha }}"
          if [ -n "$UC" ] && [ "$UC" != "${{ github.sha }}" ]; then
            echo "devam=false" >> "$GITHUB_OUTPUT"
            echo "⏭  Daha yeni bir commit var — bu deploy atlanıyor (kuyruktaki yeni deploy uygulayacak)."
          else
            echo "devam=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (yerel docker, sudo=root — .env root-only olduğu için)
        if: steps.guncel.outputs.devam == 'true'
        run: |
          chmod +x scripts/deploy-appvm.sh
          # TAG: tam sha etiketi → "latest" değil, TAM OLARAK bu commit'in imajı çekilir.
          # sudo ortamı temizler; değişkeni açıkça geçiriyoruz.
          sudo env TAG="main-${{ github.sha }}" bash scripts/deploy-appvm.sh

      # Dış doğrulama runner'dan yapılır (VPS host'unda curl yok). CF challenge'ı
      # 403 dönebilir — origin çökmesini (502/520/521) yakalamak için eşik <500.
      - name: Verify production (external)
        if: steps.guncel.outputs.devam == 'true'
        run: |
          for u in "https://markala.com.tr" "https://api.markala.com.tr/api/health"; do
            ok=0
            for i in $(seq 1 6); do
              code=$(curl -s -o /dev/null -m 25 -w '%{http_code}' -A "Mozilla/5.0 (GH-Actions verify)" "$u") || code=000
              echo "$u -> HTTP $code (deneme $i)"
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then ok=1; break; fi
              sleep 8
            done
            if [ "$ok" != "1" ]; then echo "❌ $u origin hatası veriyor"; exit 1; fi
          done
          echo "✅ Dış doğrulama geçti"

      # 2026-08-17 olayı: deploy AYLARDIR yeşil raporlanıyordu ama canlı site hiç
      # güncellenmiyordu — çünkü 15 Ağustos 20:16'da prod DNS yeni sunucuya (ESXi/Turhost)
      # taşındı, deploy ise ESKİ VPS'e gitmeye devam etti. Konteyner sağlığı ve StartedAt
      # kontrolü DOĞRU sunucuda çalıştığı için hiçbir uyarı üretmedi.
      # Bu adım, deploy ettiğimiz makinenin GERÇEKTEN canlı trafiği alan makine olduğunu
      # kanıtlar: konteyner az önce yeniden başlatıldığına göre canlı /api/health'in
      # bildirdiği uptime KÜÇÜK olmalı. Büyükse yanlış sunucuya deploy ediyoruz.
      - name: Canlı gerçekten güncellendi mi (uptime kanıtı)
        if: steps.guncel.outputs.devam == 'true'
        run: |
          UP=$(curl -s -m 25 -A "Mozilla/5.0 (GH-Actions verify)" "https://markala.com.tr/api/health" \
               | grep -o '"uptime":[0-9.]*' | cut -d: -f2 | cut -d. -f1)
          echo "canlı /api/health uptime = ${UP:-bilinmiyor} sn"
          if [ -z "$UP" ]; then
            echo "⚠ uptime okunamadı — doğrulama atlandı (health yanıtı beklenenden farklı)"
            exit 0
          fi
          if [ "$UP" -gt 900 ]; then
            echo "❌ DEPLOY CANLIYA YANSIMADI: canlı konteyner ${UP} sn ayakta (yeni başlatılmamış)."
            echo "   Deploy edilen sunucu, canlı trafiği alan sunucu DEĞİL."
            echo "   Kontrol: Cloudflare'da markala.com.tr A kaydının IP'si ile SSH_HOST secret'ı aynı mı?"
            exit 1
          fi
          echo "✅ Canlı konteyner yeni başlatılmış (${UP} sn) — deploy gerçekten yansıdı"

      - name: Notify on success
        if: success()
        run: echo "✅ Markala deployed successfully — https://markala.com.tr"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deploy FAILED — check VPS logs immediately"
