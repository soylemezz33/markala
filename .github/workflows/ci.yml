name: CI — Type Check & Build

on:
  pull_request:
    branches: [main]
  # main'e push'ta ARTIK DOĞRUDAN TETİKLENMEZ (2026-09-03). Deploy iş akışı bunu
  # workflow_call ile çağırır ve canlıya alma adımı sonucuna bağlanır. Eskiden ikisi
  # PARALEL koşuyordu: (a) test bitmeden kod canlıya inebiliyordu, (b) CI'ın web
  # build'i canlı API'den veri çekerken deploy o API'yi yeniden başlattığı için
  # son 25 koşunun 6'sı koda bağlı olmayan sebeple kırmızıydı.
  workflow_call:

concurrency:
  # github.workflow, workflow_call'da ÇAĞIRANIN adını verir → deploy'un çağırdığı
  # doğrulama, bir PR'ın CI'ıyla aynı gruba düşüp onu iptal etmez.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: CI yalnız checkout + install + build yapar.
# Üst seviye read-only token, ele geçen bir action/bağımlılığın kod push'lamasını
# veya paket yayınlamasını engeller (GitHub hardening önerisi).
permissions:
  contents: read

jobs:
  # 2026-08-04 olayının bekçisi: schema.prisma migration'sız değişirse deploy'da yeni
  # Prisma client prod DB'de olmayan kolonu SELECT eder → tüm sorgular P2022 (admin
  # "Veriler yüklenemedi" + cronlar sessiz ölür). Şema değişikliği = migration ŞART.
  schema-migration-guard:
    name: Şema ↔ Migration bekçisi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (diff için geçmişle)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Şema değiştiyse migration da değişmeli
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
            git fetch origin ${{ github.base_ref }} --depth=1
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Diff aralığı: $RANGE"
          SCHEMA_CHANGED=$(git diff --name-only $RANGE -- apps/api/prisma/schema.prisma | wc -l)
          MIGRATION_CHANGED=$(git diff --name-only $RANGE -- apps/api/prisma/migrations | wc -l)
          echo "schema.prisma değişen: $SCHEMA_CHANGED | migrations değişen: $MIGRATION_CHANGED"
          if [ "$SCHEMA_CHANGED" -gt 0 ] && [ "$MIGRATION_CHANGED" -eq 0 ]; then
            echo "::error::schema.prisma değişti ama apps/api/prisma/migrations/ altında migration yok!"
            echo "::error::Migration üret (prisma migrate dev --name <ad>) ya da elle idempotent SQL ekle — aksi halde prod'da P2022 patlar (bkz. 2026-08-04 olayı)."
            exit 1
          fi
          echo "OK — şema/migration tutarlı."

  validate:
    name: Type-check, Build & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        # Versiyon package.json "packageManager" alanından okunur (pnpm@10.33.3).
        # Burada ayrıca `version:` verilirse "Multiple versions of pnpm" hatası → CI kurulumu patlar.
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # web/admin/api type-check ve build, @prisma/client üretilmiş tiplerine bağlı.
        # Unit Tests job'ında bu adım vardı ama burada YOKTU: lockfile değişip pnpm cache'i
        # bozulunca client generate edilmiyor (pnpm v10 dependency postinstall'ları default
        # kapalı) → "@prisma/client has no exported member" ile type-check/build çöküyordu.
        run: pnpm --filter @markala/api exec prisma generate

      - name: Format check (Prettier)
        run: pnpm format:check
        # Mevcut biçim sapması build'i bloklamaz; her PR'da annotation olarak
        # görünür kalır (kademeli kapı). Tam sweep sonrası bloklayıcıya çekilecek.
        continue-on-error: true

      - name: Type-check (web)
        run: pnpm --filter @markala/web type-check

      - name: Type-check (admin)
        run: pnpm --filter @markala/admin type-check

      - name: Type-check (api)
        run: pnpm --filter @markala/api type-check
        continue-on-error: true # API henüz tam strict değil

      - name: Build (web)
        run: pnpm --filter @markala/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # 2026-08-20: bu adım 2026-08-18'den beri düşüyordu ve CI'ı kırmızı tutuyordu.
          # Sebep: lib/catalog.ts API adresini `API_INTERNAL_URL || NEXT_PUBLIC_API_URL ||
          # "http://api:4000"` diye çözüyor. CI ikisini de vermediği için Docker-içi hostname
          # olan api:4000'e düşüyor, prerender veri çekemiyor ve build patlıyordu.
          # Docker imaj build'i çalışıyordu çünkü Dockerfile bu değeri ARG olarak veriyor —
          # yani deploy yeşilken CI kırmızıydı. Aynı değeri CI'a da veriyoruz.
          NEXT_PUBLIC_API_URL: "https://api.markala.com.tr"

      - name: Build (admin)
        run: pnpm --filter @markala/admin build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          ADMIN_SESSION_SECRET: "ci-build-only-not-for-production-use-min-32-char"

      - name: KVKK legal placeholder kontrolü
        # Yasal metinlerde doldurulmamış placeholder varsa uyarır.
        # Yayın öncesi ETBİS/VERBİS/KEP kayıtları tamamlanana kadar continue-on-error aktif.
        run: |
          if grep -r "BAŞVURU BEKLEMEDE" packages/mock-data/src/legal.ts; then
            echo "::warning file=packages/mock-data/src/legal.ts::KVKK yasal metinlerde doldurulmamış placeholder bulundu. ETBİS/VERBİS/KEP kayıtları tamamlanınca ilgili sabitleri güncelleyin."
            exit 1
          fi
        continue-on-error: true

  test-unit:
    name: Unit Tests (web + api)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      # Versiyon package.json "packageManager"dan; `version:` verme → "Multiple versions" hatası.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Vitest unit tests (@markala/web)
        run: pnpm --filter @markala/web test

      # API testleri mocked Prisma kullanır ama @prisma/client tipleri için generate şart.
      - name: Generate Prisma client (api)
        run: pnpm --filter @markala/api exec prisma generate

      - name: Run Vitest unit tests (@markala/api)
        run: pnpm --filter @markala/api test

  security-audit:
    name: Dependency Audit (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      # Versiyon package.json "packageManager"dan; `version:` verme → "Multiple versions" hatası.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bilgilendirme amaçlı — high/critical zafiyetleri raporlar ama build'i bloklamaz.
      # (Dependabot otomatik bump PR'ları açar; bu adım o anki lockfile'ın anlık denetimi.)
      # Bloklayıcı yapmadan önce mevcut advisory'ler temizlenmeli → ayrı bir takip işi.
      - name: pnpm audit (high+ — non-blocking)
        run: pnpm audit --audit-level=high --prod
        continue-on-error: true
