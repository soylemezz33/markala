name: E2E — Playwright

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Test edilecek adres (boşsa canlı site)"
        required: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Uçtan uca testler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          # Öncelik: elle verilen adres → repo değişkeni → canlı site
          BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL || 'https://markala.com.tr' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-raporu
          path: e2e/playwright-report/
          retention-days: 7
