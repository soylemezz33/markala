# DEPLOY HAZIRLIK SONDASI (salt okur) — 2026-08-17 sunucu göçü sonrası.
# Amaç: "Deploy via SSH" neden düşüyor kesinleştirmek. deploy.yml ile AYNI secret'ları
# (SSH_HOST/USER/PORT/KEY) kullanır; bağlanır, HANGİ makineye düştüğünü ve deploy ön
# koşullarını (compose dosyası, .env, konteyner adları) raporlar — hiçbir şey değiştirmez.
name: Deploy Hazırlık Sondası (salt okur)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ssh-check.yml"]

jobs:
  probe:
    name: Deploy neden basarisiz
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: TCP + kimlik + deploy onkosullari
        env:
          H: ${{ secrets.SSH_HOST }}
          U: ${{ secrets.SSH_USER }}
          P: ${{ secrets.SSH_PORT }}
          K: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set +e
          PORT="${P:-22}"
          echo "SSH_HOST son okteti gizli; port=$PORT"
          echo "SSH_USER='$U'"
          echo "::notice title=0-secret::SSH_USER='$U' PORT=$PORT"

          echo "=============== 1) TCP ==============="
          timeout 12 bash -c "cat < /dev/null > /dev/tcp/$H/$PORT" 2>/dev/null && { echo "TCP ACIK"; echo "::notice title=1-TCP::PORT $PORT ACIK"; } || { echo "TCP KAPALI"; echo "::error title=1-TCP::PORT $PORT KAPALI"; }

          if [ -z "$K" ]; then echo "::error title=X::SSH_PRIVATE_KEY bos"; exit 0; fi
          printf '%s\n' "$K" > /tmp/k; chmod 600 /tmp/k
          SSHO="-i /tmp/k -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -p $PORT"

          echo "=============== 2) BAGLANDI MI + HANGI MAKINE ==============="
          OUT=$(ssh $SSHO "$U@$H" "echo CONNECTED; hostname; hostname -I 2>/dev/null | tr ' ' ','; whoami" 2>&1)
          RC=$?
          DEC=$(printf %s "$OUT" | grep -viE 'known hosts|post-quantum|store now|decrypt later|^\s*$' | tail -5 | tr '\n' ';' | cut -c1-260)
          echo "rc=$RC :: $DEC"
          if [ "$RC" -ne 0 ]; then
            echo "::error title=2-SSH::BASARISIZ rc=$RC -> $DEC"
            echo "  (Permission denied=kullanici/anahtar; Connection=NAT/ag)"
            rm -f /tmp/k; exit 0
          fi
          HN=$(printf %s "$OUT" | sed -n '2p'); IPS=$(printf %s "$OUT" | sed -n '3p'); WHO=$(printf %s "$OUT" | sed -n '4p')
          echo "::notice title=2-baglandi::hostname=$HN ip=$IPS user=$WHO"

          echo "=============== 3) BU MAKINE APP-VM Mi (markala konteynerleri) ==============="
          CT=$(ssh $SSHO "$U@$H" "docker ps --format '{{.Names}}' 2>/dev/null | grep -E 'markala' | tr '\n' ',' || echo DOCKER-YOK-veya-YETKI" 2>&1 | tail -1)
          echo "markala konteynerleri: $CT"
          echo "::notice title=3-konteynerler::$CT"

          echo "=============== 4) DEPLOY DOSYALARI ==============="
          FILES=$(ssh $SSHO "$U@$H" "ls -1 /opt/markala/docker-compose.production.yml /opt/markala/.env.production 2>&1 | tr '\n' ';'" 2>&1 | tail -1)
          echo "deploy dosyalari: $FILES"
          echo "::notice title=4-dosyalar::$FILES"

          echo "=============== 5) canli /api/health (bu makineden) ==============="
          UP=$(ssh $SSHO "$U@$H" "docker exec markala-web node -e \"fetch('http://localhost:3000/api/health').then(r=>r.json()).then(j=>console.log('uptime='+Math.round(j.uptime)))\" 2>/dev/null || echo web-yok" 2>&1 | tail -1)
          echo "$UP"
          echo "::notice title=5-web::$UP"
          rm -f /tmp/k
          echo "SONDA BITTI"
