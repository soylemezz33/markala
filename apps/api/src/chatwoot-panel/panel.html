<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>markala · müşteri</title>
<style>
/* markala panel — renkler packages/config/tailwind-preset.js ile aynı (brand sarı, ink/paper, surface).
   Chatwoot hem açık hem koyu temada açılabildiği için iki palet de tanımlı. */
:root{
  --bg:#FBFAF5; --panel:#FFFFFF; --panel2:#F5F2E8; --line:#E8E3D2; --line2:#D4CDB8;
  --fg:#1A1410; --fg2:#54483D; --muted:#837566;
  --brand:#F5B800; --brand-ink:#1A1410; --brand-soft:rgba(245,184,0,.14); --brand-line:#FCD34D;
  --link:#8F6300; --cyan:#0097B2; --cyan-soft:rgba(0,151,178,.12);
  --ok:#2E7D32; --ok-soft:rgba(46,125,50,.12);
  --warn:#ED6C02; --warn-soft:rgba(237,108,2,.12);
  --bad:#C62828; --bad-soft:rgba(198,40,40,.12);
  --info:#1565C0; --info-soft:rgba(21,101,192,.12);
  --mor:#6A1B9A; --mor-soft:rgba(106,27,154,.12);
  --golge:0 1px 2px rgba(26,20,16,.05), 0 1px 3px rgba(26,20,16,.04);
  --golge2:0 4px 14px rgba(26,20,16,.10);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1018; --panel:#161A26; --panel2:#1F2432; --line:#2A3041; --line2:#39425A;
  --fg:#FAFAF7; --fg2:#C9CDD4; --muted:#7B828F;
  --brand:#F5B800; --brand-ink:#1A1410; --brand-soft:rgba(245,184,0,.16); --brand-line:#8F6300;
  --link:#FFD60A; --cyan:#00D9FF; --cyan-soft:rgba(0,217,255,.14);
  --ok:#5CD167; --ok-soft:rgba(92,209,103,.14);
  --warn:#FFA23A; --warn-soft:rgba(255,162,58,.14);
  --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.14);
  --info:#5BA8FF; --info-soft:rgba(91,168,255,.14);
  --mor:#C58BF2; --mor-soft:rgba(197,139,242,.14);
  --golge:0 1px 2px rgba(0,0,0,.4); --golge2:0 6px 18px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
body{margin:0;padding:12px;font:13px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
a{color:var(--link);text-decoration:none;font-weight:500}
a:hover{text-decoration:underline}
.muted{color:var(--muted)}.small{font-size:12px}
b,strong{font-weight:650}

/* üst şerit */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-12px -12px 12px;padding:9px 12px;
  background:linear-gradient(90deg,var(--brand-soft),transparent 65%);border-bottom:1px solid var(--line);
  flex-wrap:wrap;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.marka{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:-.01em;color:var(--fg)}
.marka i{width:9px;height:9px;border-radius:3px;background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);display:inline-block}

/* kartlar */
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 12px;margin-bottom:9px;
  word-break:break-word;box-shadow:var(--golge)}
.card.siparis{border-left:3px solid var(--durum,var(--line2));transition:box-shadow .15s ease}
.card.siparis:hover{box-shadow:var(--golge2)}
.card.cari{border-left:3px solid var(--cyan)}
.card.ic{background:var(--panel2);box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
h1{font-size:15px;margin:0;letter-spacing:-.01em}
h2{font-size:11px;margin:14px 0 7px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:7px}
h2::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--brand)}
h2:first-child{margin-top:0}
.tutar{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.no{font-variant-numeric:tabular-nums}

.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;
  background:linear-gradient(135deg,var(--brand),#FCD34D);color:var(--brand-ink);flex:0 0 auto}

/* rozetler */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:650;
  background:var(--panel2);color:var(--fg2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.mor{background:var(--mor-soft);color:var(--mor)}
.chip.cyan{background:var(--cyan-soft);color:var(--cyan)}
.chip.brand{background:var(--brand-soft);color:var(--link)}
.chip.nokta::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* düğmeler */
.btn{font:inherit;font-size:11.5px;font-weight:600;padding:4px 10px;border:1px solid var(--line2);background:var(--panel);
  color:var(--fg2);border-radius:7px;cursor:pointer;white-space:nowrap;transition:border-color .12s ease,color .12s ease,transform .12s ease}
.btn:hover:not(:disabled){border-color:var(--brand);color:var(--fg);text-decoration:none;transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}

/* durum adımları */
.adimlar{display:flex;flex-wrap:wrap;gap:5px}
.adim{font:inherit;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel2);color:var(--muted);display:inline-flex;align-items:center;gap:6px;
  transition:border-color .12s ease,color .12s ease,transform .12s ease}
.adim::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line2);flex:0 0 auto}
.adim.gecildi{color:var(--fg2);background:var(--panel)}
.adim.gecildi::before{background:var(--ok)}
.adim.simdi{background:var(--brand-soft);border-color:var(--brand);color:var(--fg);box-shadow:0 0 0 3px var(--brand-soft)}
.adim.simdi::before{background:var(--brand);animation:nabiz 2s ease-in-out infinite}
.adim:hover:not(:disabled):not(.simdi){border-color:var(--brand);color:var(--fg);transform:translateY(-1px)}
.adim:disabled{cursor:not-allowed;opacity:.5}
.adim.onay{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
@keyframes nabiz{0%,100%{opacity:1}50%{opacity:.3}}

/* form */
input,textarea,select{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line2);border-radius:7px;
  background:var(--panel);color:var(--fg);max-width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[type=file]{font-size:11px;padding:4px 5px;border-style:dashed}
textarea{width:100%;resize:vertical;min-height:54px}
::placeholder{color:var(--muted)}

ul{margin:5px 0;padding-left:17px}li{margin:2px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:6px;font-size:12px}
.kv b{font-weight:600;color:var(--muted)}
.next{margin-top:8px;padding:7px 10px;border-radius:8px;background:var(--brand-soft);border:1px solid var(--brand-line);
  font-weight:600;font-size:12px;color:var(--fg)}
.state{padding:24px 10px;text-align:center;color:var(--muted)}
code{font-size:11px;background:var(--panel2);padding:1px 5px;border-radius:4px}

details.blok{border-top:1px solid var(--line);padding-top:9px;margin-top:11px}
details.blok>summary{cursor:pointer;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);list-style:none}
details.blok>summary::-webkit-details-marker{display:none}
details.blok>summary::before{content:"▸";color:var(--brand);margin-right:6px;display:inline-block}
details.blok[open]>summary::before{content:"▾"}
details.blok>summary:hover{color:var(--fg)}

.grid2{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr;gap:18px}}
.detay{animation:ac .18s ease}
@keyframes ac{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* dosyalar */
.dosya{display:flex;gap:7px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap;font-size:12px}
.dosya:last-child{border-bottom:0}
.etiket{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:5px}
.meta{font-size:12px;margin-top:3px;color:var(--fg2)}
.tur{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tur.onizleme{background:var(--cyan-soft);color:var(--cyan)}
.tur.baski{background:var(--brand-soft);color:var(--link)}
.tur.calisma{background:var(--mor-soft);color:var(--mor)}
.tur.musteri{background:var(--info-soft);color:var(--info)}
.gorsel{max-width:110px;max-height:74px;border-radius:6px;border:1px solid var(--line);display:block;box-shadow:var(--golge)}
.kutu{border:1px dashed var(--line2);border-radius:8px;padding:8px 9px;margin-top:8px;background:var(--panel2)}

/* zaman çizelgesi */
.tl{margin:7px 0 0;padding:0 0 0 15px;list-style:none;border-left:2px solid var(--line)}
.tl li{margin:0 0 8px;font-size:12px;position:relative}
.tl li::before{content:"";position:absolute;left:-20px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--line2);border:2px solid var(--bg)}
.tl li.t-odeme::before{background:var(--ok)}
.tl li.t-durum::before{background:var(--info)}
.tl li.t-kargo::before{background:var(--cyan)}
.tl li.t-fatura::before{background:var(--mor)}
.tl li.t-not::before{background:var(--warn)}
.tl li.t-tasarim::before{background:var(--brand)}
.tl li.t-iade::before{background:var(--bad)}
.tl .t{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}

.uyari{padding:7px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:12px;margin:7px 0;font-weight:500}
.iyi{padding:7px 10px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-size:12px;margin:7px 0;font-weight:500}
.giris{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.giris input{flex:1 1 160px;min-width:130px}
.notlar{max-height:230px;overflow:auto}
.not{padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.not:last-child{border-bottom:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
/* Dar iframe (Chatwoot sağ paneli 380-460px olabiliyor): uzun etiketli düğmeler ve
   dosya adları satırı taşırıyordu → yatay kaydırma çubuğu çıkıyor, sağ kenar kesiliyordu. */
body{overflow-x:hidden}
.grid2>*{min-width:0}
.dosya a,.meta a,.kv span{overflow-wrap:anywhere}
input[type=file]{max-width:100%}
@media (max-width:560px){
  body{padding:10px}
  .topbar{margin:-10px -10px 10px}
  .btn,.adim{white-space:normal;text-align:left}
  .dosya{gap:5px}
  .gorsel{max-width:84px;max-height:58px}
  .kv{grid-template-columns:1fr;gap:1px 0}
  .kv b{margin-top:5px}
  /* Dosya seçici + uzun düğme yan yana sığmıyor → dikey yığ. */
  .kutu .wrap,.giris{flex-direction:column;align-items:stretch}
  .kutu select,.kutu input,.kutu .btn,.giris input,.giris .btn{width:100%}
  .card{overflow:hidden}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="topbar">
  <span class="marka"><i></i>markala<span class="small muted" style="font-weight:500" id="ts"></span></span>
  <span class="wrap"><span id="oturum"></span><button class="btn" id="refresh">Yenile</button></span>
</div>
<div id="app"><div class="state">Chatwoot bekleniyor…</div></div>
<script>
const CFG = __CONFIG__;
const qs = new URLSearchParams(location.search);
const KEY = qs.get('k') || '';
const app = document.getElementById('app');
// /api/chatwoot-panel → /api ; sipariş uçları (/api/orders/...) aynı kökten çağrılır.
const API = location.pathname.replace(/\/chatwoot-panel\/?$/, '') || '';
const PANEL = API + '/chatwoot-panel';
let lastPhone = null;
let sonVeri = null;
const acikDetaylar = new Set();

// Renkler admin panelindeki STATUS_LABELS ile aynı aileden: her aşama ayrı renk,
// ajan listeye bakar bakmaz siparişin nerede olduğunu görsün.
const STATUS = {
  siparis_alindi: ['Sipariş alındı', 'info'],
  tasarim_bekleniyor: ['Tasarım bekleniyor', 'warn'],
  tasarim_onayindi: ['Tasarım onayında', 'mor'],
  tasarim_onaylandi: ['Tasarım onaylandı', 'ok'],
  uretimde: ['Üretimde', 'brand'],
  kargoya_verildi: ['Kargoda', 'cyan'],
  teslim_edildi: ['Teslim edildi', 'ok'],
  iptal_edildi: ['İptal', 'bad'],
};
/** Sipariş kartının sol kenar şeridi — durumun rengi. */
const DURUM_RENK = {
  'siparis-alindi': 'var(--info)', 'tasarim-bekleniyor': 'var(--warn)', 'tasarim-onayindi': 'var(--mor)',
  'tasarim-onaylandi': 'var(--ok)', uretimde: 'var(--brand)', 'kargoya-verildi': 'var(--cyan)',
  'teslim-edildi': 'var(--ok)', 'iptal-edildi': 'var(--bad)',
};
// Panelden seçilebilen durumlar (iptal + iade bilerek YOK — geri alınamaz işlemler admin panelinde kalır).
const DURUM_SIRASI = ['siparis-alindi','tasarim-bekleniyor','tasarim-onayindi','tasarim-onaylandi','uretimde','kargoya-verildi','teslim-edildi'];
const DURUM_ADI = {
  'siparis-alindi':'Sipariş Alındı','tasarim-bekleniyor':'Tasarım Bekleniyor','tasarim-onayindi':'Tasarım Onayında',
  'tasarim-onaylandi':'Tasarım Onaylandı','uretimde':'Üretimde','kargoya-verildi':'Kargoya Verildi','teslim-edildi':'Teslim Edildi','iptal-edildi':'İptal Edildi',
};
// Kargo rolü (orders.status izni YOK) yalnız bu ikisini işaretleyebilir — sunucudaki kuralın aynısı.
const KARGO_GECISLERI = ['uretimde','kargoya-verildi'];
const PAY = { beklemede: ['Ödeme bekleniyor', 'warn'], basarili: ['Ödendi', 'ok'], basarisiz: ['Ödeme başarısız', 'bad'], iade_edildi: ['İade edildi', 'mor'] };
const METHOD = { iyzico: 'Kart', cari: 'Cari', havale: 'Havale' };
const KIND = { onizleme: 'Prova', baski: 'Baskı dosyası', calisma: 'Çalışma', musteri: 'Müşteri dosyası' };

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => (n == null || n === '' ? '' : new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(Number(n)));
const day = (s) => (s ? new Date(s).toLocaleDateString('tr-TR', { day: '2-digit', month: 'short' }) : '');
const dayY = (s) => (s ? new Date(s).toLocaleDateString('tr-TR', { day: '2-digit', month: 'short', year: 'numeric' }) : '');
const dayT = (s) => (s ? new Date(s).toLocaleString('tr-TR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '');
const kb = (n) => (n == null ? '' : n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB');
const tpl = (t, id, q) => (t ? t.replace('{id}', encodeURIComponent(id || '')).replace('{q}', encodeURIComponent(q || '')) : '');
const chip = (map, key) => { const v = map[key] || [key, '']; return `<span class="chip nokta ${v[1]}">${esc(v[0])}</span>`; };
const bassAsHarf = (ad) => String(ad || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const link = (href, label) => (href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label));
const copyBtn = (text) => (text ? `<button class="btn" data-copy="${esc(text)}">kopyala</button>` : '');
const openBtn = (href) => (href ? `<a class="btn" href="${esc(href)}" target="_blank" rel="noopener">Panelde aç</a>` : '');
const slug = (s) => String(s || '').replace(/_/g, '-');

function show(html) { app.innerHTML = html; }
function state(msg) { show(`<div class="state">${msg}</div>`); }

/* ───────────────── oturum (ajan girişi) ───────────────── */
const DEPO = 'mk_cw_oturum';
let AUTH = null;
try { AUTH = JSON.parse(localStorage.getItem(DEPO) || 'null'); } catch { AUTH = null; }
let ajanEposta = '';

const yetki = (p) => !!(AUTH && AUTH.kullanici && (AUTH.kullanici.izinler || []).includes(p));
const girisli = () => !!(AUTH && AUTH.token);

function oturumCiz() {
  const el = document.getElementById('oturum');
  if (girisli()) {
    const k = AUTH.kullanici;
    el.innerHTML = `<span class="small muted">${esc(k.ad)} · ${esc(k.rol)}</span> <button class="btn" id="cikis">çıkış</button>`;
    document.getElementById('cikis').onclick = () => cikis(false);
  } else {
    el.innerHTML = `<button class="btn" id="girisAc">Giriş yap</button>`;
    document.getElementById('girisAc').onclick = () => { girisFormu(true); };
  }
}

function cikis(dustu) {
  AUTH = null;
  try { localStorage.removeItem(DEPO); } catch {}
  oturumCiz();
  if (sonVeri) render(sonVeri, lastPhone, dustu ? 'Oturum süresi doldu — tekrar giriş yapın.' : '');
}

function girisFormu(odakla) {
  const yer = document.getElementById('girisYeri');
  if (!yer) return;
  yer.innerHTML = `
    <form class="giris" id="girisForm">
      <input type="email" id="gEposta" placeholder="panel e-postan" autocomplete="username" value="${esc(ajanEposta)}">
      <input type="password" id="gSifre" placeholder="şifre" autocomplete="current-password">
      <button class="btn primary" type="submit">Giriş</button>
    </form>
    <div class="small muted" style="margin-top:4px">markala panel hesabın — yetkilerin panelde olduğu gibi geçerli.</div>
    <div id="girisHata"></div>`;
  const f = document.getElementById('girisForm');
  if (odakla) (document.getElementById('gEposta').value ? document.getElementById('gSifre') : document.getElementById('gEposta')).focus();
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = f.querySelector('button');
    btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch(`${PANEL}/oturum?k=${encodeURIComponent(KEY)}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store',
        body: JSON.stringify({ email: document.getElementById('gEposta').value.trim(), password: document.getElementById('gSifre').value }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(mesaj(j) || ('Giriş başarısız (' + r.status + ')'));
      AUTH = j;
      try { localStorage.setItem(DEPO, JSON.stringify(j)); } catch {}
      oturumCiz();
      if (sonVeri) render(sonVeri, lastPhone);
    } catch (e) {
      const h = document.getElementById('girisHata');
      if (h) h.innerHTML = `<div class="uyari">${esc(e.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Giriş';
    }
  };
}

const mesaj = (j) => (Array.isArray(j?.message) ? j.message.join(' · ') : j?.message || '');

/** Yetkili istek — 401'de oturumu düşürür (token süresi dolmuş olabilir). */
async function api(path, opts = {}) {
  const h = Object.assign({}, opts.headers || {});
  if (AUTH?.token) h.Authorization = 'Bearer ' + AUTH.token;
  let body = opts.form || null;
  if (opts.json) { h['Content-Type'] = 'application/json'; body = JSON.stringify(opts.json); }
  const r = await fetch(API + path, { method: opts.method || 'GET', headers: h, body, cache: 'no-store' });
  if (r.status === 401) { cikis(true); throw new Error('Oturum düştü.'); }
  const t = await r.text();
  let j = null; try { j = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) throw new Error(mesaj(j) || ('Hata ' + r.status));
  return j;
}

/* ───────────────── özet görünüm ───────────────── */
function nextStep(o) {
  const items = o.items || [];
  if (o.status === 'iptal_edildi') return null;
  if (o.paymentStatus === 'basarisiz') return 'Ödeme başarısız' + (o.paymentError ? ': ' + esc(o.paymentError) : '') + ' — yeniden ödeme / havale önerin';
  if (o.paymentStatus === 'beklemede' && o.paymentMethod === 'havale') return 'Havale bekleniyor — dekont isteyin';
  if (o.paymentStatus === 'beklemede' && o.paymentMethod !== 'cari') return 'Ödeme tamamlanmamış — müşteri ödemeyi bitirmeli';
  switch (o.status) {
    case 'siparis_alindi': return 'Sipariş alındı — tasarım/dosya adımına geçecek';
    case 'tasarim_bekleniyor':
      if (items.some((i) => i.needsDesignSupport)) return 'Tasarımcı çalışıyor — prova çıkınca onaya gidecek';
      if (items.some((i) => !i.uploadedFileUrl)) return 'Müşteriden baskı dosyası bekleniyor (a-dosya)';
      return 'Dosya geldi — tasarımcı kontrolünde';
    case 'tasarim_onayindi': return 'Prova müşteri onayında — onay/revize isteyin';
    case 'tasarim_onaylandi': return 'Onaylandı — üretime alınacak';
    case 'uretimde': return 'Üretimde — kargoya verilince takip no gelir';
    case 'kargoya_verildi': return 'Kargoda — takip linkini paylaşın';
    case 'teslim_edildi': return 'Teslim edildi';
  }
  return null;
}

function renderOrder(o) {
  const s = o.ship || {}, inv = o.invoice || {};
  const proofs = (o.proofs || []).map((p) =>
    `<div class="meta"><span class="tur ${esc(p.kind)}">${esc(KIND[p.kind] || p.kind)}</span>${link(p.fileUrl, p.fileName)} <span class="muted">${day(p.createdAt)}</span> ${copyBtn(p.fileUrl)}</div>`).join('');
  const files = (o.items || []).filter((i) => i.uploadedFileUrl).map((i) =>
    `<div class="meta"><span class="tur musteri">Müşteri</span>${link(i.uploadedFileUrl, i.uploadedFileName || 'dosya')} <span class="muted">${esc(i.productName)}</span></div>`).join('');
  const notes = (o.internalNotes || []).map((n) =>
    `<div class="meta muted"><span class="etiket">İç not</span>${esc(n.authorName)} · ${day(n.createdAt)} — ${esc(n.body)}</div>`).join('');
  const nx = nextStep(o);
  const panelUrl = tpl(CFG.panel.order, o.id);
  const detayAcik = acikDetaylar.has(o.id);
  return `<div class="card siparis" data-order="${esc(o.id)}" style="--durum:${DURUM_RENK[slug(o.status)] || 'var(--line2)'}">
    <div class="row"><b class="no">${esc(o.orderNumber)}</b><span class="muted small">${dayY(o.createdAt)}</span></div>
    <div class="row" style="margin-top:4px"><div class="wrap">${chip(STATUS, o.status)}${chip(PAY, o.paymentStatus)}${o.paymentMethod ? `<span class="chip">${esc(METHOD[o.paymentMethod] || o.paymentMethod)}</span>` : ''}${o.isGuest ? '<span class="chip">misafir</span>' : ''}</div><span class="tutar">${money(o.total)}</span></div>
    <div style="margin:7px 0 4px">${(o.items || []).map((i) => `<div class="meta"><b>${esc(i.productName)}</b> <span class="chip">×${i.quantity}</span>${i.configurationSummary ? ` <span class="muted">${esc(i.configurationSummary)}</span>` : ''}</div>`).join('')}</div>
    ${s.trackingNumber ? `<div class="meta"><span class="etiket">Kargo</span>${esc(s.carrier || '')} ${link(s.trackingUrl, s.trackingNumber)} ${copyBtn(s.trackingUrl || s.trackingNumber)} <span class="muted">${s.shippedAt ? 'çıkış ' + day(s.shippedAt) : ''}${s.deliveredAt ? ' · teslim ' + day(s.deliveredAt) : ''}</span></div>` : ''}
    ${s.city ? `<div class="meta muted"><span class="etiket">Teslimat</span>${esc(s.district || '')} / ${esc(s.city)}</div>` : ''}
    ${proofs}${files}
    ${inv.number ? `<div class="meta"><span class="etiket">Fatura</span><span class="no">${esc(inv.number)}</span> <span class="muted">${day(inv.issuedAt)}</span></div>` : ''}
    ${o.customerNote ? `<div class="meta"><span class="etiket">Müşteri notu</span><i>${esc(o.customerNote)}</i></div>` : ''}
    ${notes}
    ${nx ? `<div class="next">${nx}</div>` : ''}
    <div class="row" style="margin-top:6px">
      <span>${girisli() ? `<button class="btn" data-detay="${esc(o.id)}">${detayAcik ? 'Detayı kapat' : 'Detay ve işlemler'}</button>` : ''}</span>
      <span>${copyBtn(o.orderNumber)} ${openBtn(panelUrl)}</span>
    </div>
    <div class="detay" id="detay-${esc(o.id)}"></div>
  </div>`;
}

function renderCustomer(c) {
  const corp = c.corporateStatus === 'approved';
  const type = corp ? `<span class="chip ok">Kurumsal</span>${esc(c.companyName || '')}`
    : c.corporateStatus === 'pending' ? '<span class="chip warn">Kurumsal başvuru bekliyor</span>'

      ${openBtn(tpl(CFG.panel.customer, c.id))}

    <div class="small muted" style="margin-top:7px">${esc(c.email || '')} · ${esc(c.phone || '')} · üye ${dayY(c.memberSince)}</div>

function renderCorporate(k) {
  const inv = k.lastInvoice;
  return `<div class="card cari"><b>Cari</b>
    <div class="kv">
      <b>Bakiye</b><span class="${k.balance > 0 ? '' : 'muted'}">${money(k.balance)}${k.balance > 0 ? ' borçlu' : ''}</span>

      ${inv ? `<b>Son fatura</b><span>${esc(inv.period)} · ${money(inv.totalAmount)} · ${inv.orderCount} sipariş <span class="chip ${inv.status === 'paid' ? 'ok' : 'warn'}">${esc(inv.status)}</span></span>` : ''}

function render(d, phone, uyari) {
  sonVeri = d;
  document.getElementById('ts').textContent = 'güncellendi ' + new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  oturumCiz();
  if (!d.found) {
    const search = tpl(CFG.panel.search, '', d.phoneKey || phone);
    return state(`Bu numarayla markala'da kayıt/sipariş yok.<br><span class="small">${esc(phone)}</span><br><br>${search ? `<a class="btn" href="${esc(search)}" target="_blank" rel="noopener">Panelde ara</a>` : ''}`);
  }
  let html = uyari ? `<div class="uyari">${esc(uyari)}</div>` : '';
  html += (d.customers || []).map(renderCustomer).join('');
  if (!(d.customers || []).length) html += `<div class="card small muted">Kayıtlı hesap yok — misafir siparişleri (${esc(phone)})</div>`;
  if (d.corporate) html += renderCorporate(d.corporate);
  if (!girisli()) html += `<div class="card vurgu small"><b>İşlem yapmak için giriş yap</b><div class="muted">Durum değiştirme, iç not, kargo takip no ve tasarım yükleme/onaya gönderme girişten sonra açılır.</div><div id="girisYeri"></div></div>`;
  const list = d.orders.items || [];
  html += `<div class="row small muted" style="margin:6px 2px"><span>Siparişler</span><span>${d.orders.total} toplam${d.orders.total > list.length ? ` · son ${list.length}` : ''}</span></div>`;

  show(html);
  if (!girisli()) girisFormu(false);
  // Açık kalan detayları yeniden yükle (işlem sonrası tazelemede kapanmasın).
  for (const id of Array.from(acikDetaylar)) if (list.some((o) => o.id === id)) detayYukle(id);
}

/* ───────────────── detay + işlemler ───────────────── */
const detayKutusu = (id) => document.getElementById('detay-' + id);

async function detayYukle(id) {
  const kutu = detayKutusu(id);
  if (!kutu) return;
  kutu.innerHTML = '<div class="state small">Detay yükleniyor…</div>';
  try {
    const [o, zaman, notlar] = await Promise.all([
      api('/orders/' + encodeURIComponent(id)),
      api('/orders/' + encodeURIComponent(id) + '/zaman-cizelgesi').catch(() => null),
      // İç notlar AYRI uçta (sipariş detayı bunları döndürmez); izin yoksa sessizce atla.
      yetki('orders.notes') ? api('/orders/' + encodeURIComponent(id) + '/notlar').catch(() => null) : Promise.resolve(null),
    ]);
    kutu.innerHTML = detayHtml(o, zaman, notlar);
    detayOlaylari(kutu, o);
  } catch (e) {
    kutu.innerHTML = `<div class="uyari">${esc(e.message)}</div>`;
  }
}

  if (!a) return '';

    <div class="small muted">${esc(a.fullAddress || '')}<br>${esc(a.district || '')} / ${esc(a.city || '')}${a.zipCode ? ' · ' + esc(a.zipCode) : ''}</div>

}

/* ───────────────── detay içi eylemler ───────────────── */
function detayOlaylari(kutu, o) {
  const id = o.id;
  const yaz = (sel, html) => { const el = kutu.querySelector(sel); if (el) el.innerHTML = html; };
  const hata = (sel, e) => yaz(sel, `<div class="uyari">${esc(e.message)}</div>`);
  const iyi = (sel, m) => yaz(sel, `<div class="iyi">${esc(m)}</div>`);

  // durum değiştir — iki adımlı onay (iframe'de confirm() engellenebiliyor)
  kutu.querySelectorAll('[data-durum]').forEach((b) => {
    b.onclick = async () => {
      const hedef = b.dataset.durum;
      if (b.dataset.onay !== '1') {
        kutu.querySelectorAll('[data-durum]').forEach((x) => { if (x !== b) { x.dataset.onay = ''; x.classList.remove('onay'); x.textContent = DURUM_ADI[x.dataset.durum]; } });
        b.dataset.onay = '1';
        b.classList.add('onay');
        b.textContent = DURUM_ADI[hedef] + ' · onayla?';
        return;
      }
      b.disabled = true; b.textContent = '…';
      try {
        const govde = { status: hedef };
        if (hedef === 'kargoya-verildi') {
          const f = kutu.querySelector('[data-kargoFirma]'), n = kutu.querySelector('[data-kargoNo]');
          if (f && f.value.trim()) govde.trackingCarrier = f.value.trim();
          if (n && n.value.trim()) govde.trackingNumber = n.value.trim();
        }
        await api('/orders/' + encodeURIComponent(id) + '/status', { method: 'PATCH', json: govde });
        iyi('[data-durumSonuc]', 'Durum güncellendi: ' + DURUM_ADI[hedef] + ' (müşteri bildirimi sistemin kuralına göre gider)');
        await tazele();
      } catch (e) { hata('[data-durumSonuc]', e); b.disabled = false; b.textContent = DURUM_ADI[hedef]; b.dataset.onay = ''; b.classList.remove('onay'); }
    };
  });

  const kargoBtn = kutu.querySelector('[data-kargoKaydet]');
  if (kargoBtn) kargoBtn.onclick = async () => {
    kargoBtn.disabled = true;
    try {
      await api('/orders/' + encodeURIComponent(id) + '/tracking', {
        method: 'PATCH',
        json: { trackingCarrier: kutu.querySelector('[data-kargoFirma]').value.trim(), trackingNumber: kutu.querySelector('[data-kargoNo]').value.trim() },
      });
      iyi('[data-kargoSonuc]', 'Takip bilgisi kaydedildi.');
      await tazele();
    } catch (e) { hata('[data-kargoSonuc]', e); } finally { kargoBtn.disabled = false; }
  };

  const notBtn = kutu.querySelector('[data-notEkle]');
  if (notBtn) notBtn.onclick = async () => {
    const ta = kutu.querySelector('[data-notMetin]');
    const body = (ta.value || '').trim();
    if (!body) return;
    notBtn.disabled = true;
    try {
      await api('/orders/' + encodeURIComponent(id) + '/notlar', { method: 'POST', json: { body } });
      ta.value = '';
      iyi('[data-notSonuc]', 'Not eklendi.');
      await detayYukle(id);
    } catch (e) { hata('[data-notSonuc]', e); } finally { notBtn.disabled = false; }
  };

  kutu.querySelectorAll('[data-yukle]').forEach((b) => {
    b.onclick = async () => {
      const itemId = b.dataset.yukle;
      const inp = kutu.querySelector(`[data-dosya="${CSS.escape(itemId)}"]`);
      const kind = kutu.querySelector(`[data-kind="${CSS.escape(itemId)}"]`).value;
      const durum = kutu.querySelector(`[data-yukleDurum="${CSS.escape(itemId)}"]`);
      if (!inp.files || !inp.files[0]) { durum.textContent = 'Dosya seç'; return; }
      const fd = new FormData();
      fd.append('file', inp.files[0]);
      fd.append('kind', kind);
      b.disabled = true; durum.textContent = 'yükleniyor…';
      try {
        await api('/orders/' + encodeURIComponent(id) + '/items/' + encodeURIComponent(itemId) + '/tasarim', { method: 'POST', form: fd });
        durum.textContent = 'yüklendi';
        await detayYukle(id);
      } catch (e) { durum.innerHTML = `<span class="chip bad">${esc(e.message)}</span>`; b.disabled = false; }
    };
  });

  kutu.querySelectorAll('[data-sil]').forEach((b) => {
    b.onclick = async () => {
      if (b.dataset.onay !== '1') { b.dataset.onay = '1'; b.textContent = 'emin misin?'; return; }
      b.disabled = true;
      try {
        await api('/orders/' + encodeURIComponent(id) + '/tasarim/' + encodeURIComponent(b.dataset.sil), { method: 'DELETE' });
        await detayYukle(id);
      } catch (e) { b.outerHTML = `<span class="chip bad">${esc(e.message)}</span>`; }
    };
  });

  const onayBtn = kutu.querySelector('[data-onayGonder]');
  if (onayBtn) onayBtn.onclick = async () => {
    const inp = kutu.querySelector('[data-onayDosya]');
    const sonuc = kutu.querySelector('[data-onaySonuc]');
    onayBtn.disabled = true; sonuc.textContent = 'gönderiliyor…';
    try {
      const fd = new FormData();
      if (inp.files && inp.files[0]) fd.append('file', inp.files[0]);
      const r = await api('/orders/' + encodeURIComponent(id) + '/tasarim-onay', { method: 'POST', form: fd });
      sonuc.innerHTML = `<span class="chip ok">Gönderildi${r && r.alici ? ' → ' + esc(r.alici) : ''}</span>`;
      await tazele();
    } catch (e) { sonuc.innerHTML = `<span class="chip bad">${esc(e.message)}</span>`; onayBtn.disabled = false; }
  };
}

/** Özet listeyi (rozetler, kargo, notlar) sunucudan tazeler; açık detaylar korunur. */
async function tazele() {
  if (lastPhone) await load(lastPhone, true);
}

/* ───────────────── veri yükleme ───────────────── */
async function load(phone, sessiz) {
  if (!KEY) return state('Panel anahtarı yok — Chatwoot ayarındaki URL <code>?k=…</code> ile bitmeli.');
  if (!sessiz) state('Aranıyor…');
  try {
    const r = await fetch(`${PANEL}/lookup?phone=${encodeURIComponent(phone)}&k=${encodeURIComponent(KEY)}`, { cache: 'no-store' });
    if (r.status === 401) return state('Anahtar reddedildi (401) — CHATWOOT_PANEL_KEY ile URL\'deki k uyuşmuyor.');
    if (!r.ok) return state('Sunucu hatası ' + r.status);
    render(await r.json(), phone);
  } catch (e) { state('Bağlantı hatası: ' + esc(e.message)); }
}

/** Chatwoot'tan gelen appContext: inbox filtresi + telefon → arama */
function onContext(d) {
  const conv = d.conversation || {}, contact = d.contact || {};
  const ajan = d.currentAgent || {};
  if (ajan.email) ajanEposta = ajan.email; // giriş formunda hazır gelsin
  const inbox = conv.inbox_id;
  if (CFG.markalaInboxes.length && inbox != null && !CFG.markalaInboxes.includes(Number(inbox))) return state('Bu konuşma markala hattında değil.');
  const phone = contact.phone_number || (conv.meta && conv.meta.sender && conv.meta.sender.phone_number) || '';
  if (!phone) return state('Kişide telefon numarası yok.');
  if (phone === lastPhone) return;
  lastPhone = phone;
  acikDetaylar.clear();
  load(phone);
}

window.addEventListener('message', (ev) => {
  if (CFG.chatwootOrigin && ev.origin !== CFG.chatwootOrigin) return;
  let msg = ev.data;
  if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch { return; } }
  if (!msg || msg.event !== 'appContext') return;
  onContext(msg.data || {});
});

document.getElementById('refresh').onclick = () => {
  if (lastPhone) load(lastPhone);
  else window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*');
};

document.addEventListener('click', (ev) => {
  const kopya = ev.target.closest('[data-copy]');
  if (kopya) { copy(kopya.dataset.copy, kopya); return; }
  const detay = ev.target.closest('[data-detay]');
  if (detay) {
    const id = detay.dataset.detay;
    if (acikDetaylar.has(id)) {
      acikDetaylar.delete(id);
      const k = detayKutusu(id); if (k) k.innerHTML = '';
      detay.textContent = 'Detay ve işlemler';
    } else {
      acikDetaylar.add(id);
      detay.textContent = 'Detayı kapat';
      detayYukle(id);
    }
  }
});

function copy(text, btn) {
  const done = () => { const t = btn.textContent; btn.textContent = 'kopyalandı'; setTimeout(() => (btn.textContent = t), 1200); };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch {}
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}
